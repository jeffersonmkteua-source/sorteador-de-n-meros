<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Sorteador de Números</title>
</head>

<body>
    <div class="container">
        <div class="dado">
            <img src="assets/sort 1.png" alt="Imagem Sorteador">
        </div>

        <h2>Sortear número</h2>

        <div class="input">
            <input type="number" id="numeroMin" placeholder="Mínimo">
            <input type="number" id="numeroMax" placeholder="Máximo">
        </div>

        <button id="botaoSortear">Sortear</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
